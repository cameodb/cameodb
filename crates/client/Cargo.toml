[package]
name = "client"
version = "0.2.3"
edition = "2024"
license = "MIT"

[dependencies]
anyhow.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
clap = { version = "4.6.0", features = ["derive", "env"] }
rustyline = { workspace = true }
dirs = "6.0.0"
csv = "1.4"
storage = { path = "../storage", version = "0.2.3" }
colored_json = "5.0.0"
colored = "3.1.1"
flate2 = "1.1.9"
zip = "8.6"
# Both already in the tree via the server's auth module and its transitive deps, so the
# audit and licence surface is unchanged. sha2 computes the key_id the server logs; zeroize
# scrubs a key from memory on drop.
sha2 = "0.10"
zeroize = "1.9"

[dev-dependencies]
# The binary installs the ring provider in `main.rs`; a unit test that builds a reqwest
# Client has to do the same or reqwest panics on construction.
rustls = { workspace = true }
