[package]
name = "storage"
version = "0.3.6"
edition = "2024"
license = "Apache-2.0"
# Not published: consumed via path dependencies only.
publish = false

[dependencies]
anyhow = { workspace = true }
redb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tantivy = { workspace = true }
# The fst crate tantivy itself depends on, same version: reads the Croatian analyzer data.
tantivy-fst = "0.5"
tracing = { workspace = true }
chrono = { version = "0.4.44", features = ["serde"] }
walkdir = "2.5"
dashmap = "6.1.0"
xxhash-rust = { workspace = true }
sysinfo = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
tempfile = "3.27.0"
