[package]
name = "storage"
version = "0.3.10"
edition = "2024"
license = "Apache-2.0"
# Not published: consumed via path dependencies only.
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
redb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tantivy = { workspace = true }
# The LZ4 tantivy itself depends on, same version: compresses document rows in redb.
lz4_flex = { version = "0.13", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
# The zstd tantivy itself depends on, same version, so no second copy of the C library is
# built: the other way to compress document rows. Stable API only: rows are standard zstd
# frames, as tantivy writes its own.
zstd-safe = { version = "7", default-features = false, features = ["std"] }
# The fst crate tantivy itself depends on, same version: reads the Croatian analyzer data.
tantivy-fst = "0.5"
# The Snowball stemmers tantivy itself depends on, same version: the Italian analyzer runs one
# directly, as it needs the word before stemming too.
rust-stemmers = "1.2"
tracing = { workspace = true }
chrono = { version = "0.4.44", features = ["serde"] }
walkdir = "2.5"
dashmap = "6.1.0"
xxhash-rust = { workspace = true }
sysinfo = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
tempfile = "3.27.0"
# The cjk fold table test checks the MANIFEST checksum; already in the lock through client/server.
sha2 = "0.11"
