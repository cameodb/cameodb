[node]
label = "cameodb"
zone = "default"
# Security posture: local (loopback only) | internal (trusted network) | external (untrusted).
# Describes reach, not a lifecycle stage — pick by who can reach bind_address below, not by
# whether this node is for development, testing or production.
# Enforced at startup; run `cameodb check-config` to see the resolved rules.
profile = "internal"

[network.http]
bind_address = "0.0.0.0"
port = 9480
request_timeout_secs = 30
# Browser origins allowed to call this node. Empty means no cross-origin access, which
# is what API and MCP clients want; "*" is rejected outside the local profile.
cors_allowed_origins = []
max_concurrent_requests = 128
# Mount the /_admin/* routes. They are unauthenticated unless [security] is enabled, in
# which case they require a key holding node-admin. Keep them off where the node is
# reachable off-box and authentication is not on.
admin_enabled = true

# How large a thing may get on this node, as opposed to what one caller may ask for — that is
# [security.limits] below. max_record_size_mb is the source of truth: the HTTP body ceiling, the
# inter-node message size, the request timeout and the largest MCP response all derive from it,
# so raising it for large documents moves them together. `cameodb check-config` prints what each
# one resolved to.
[limits]
max_record_size_mb = 64
# 0 derives it from max_record_size_mb (+64 MB for framing). Set it to pin the body ceiling on
# its own; max_concurrent_requests multiplied by it has to fit inside total_memory_limit_mb,
# because in-flight bodies are held in memory.
max_body_size_mb = 0
# The node's memory budget: the indexer pool is sized from it and startup weighs the body
# ceiling against it.
total_memory_limit_mb = 4096
# Largest MCP search response in bytes. Unset it follows the body ceiling; set it below that
# where the callers are agents whose context is smaller than what the node can send.
# max_response_bytes = 16777216

[network.cluster]
enabled = false
bind_address = "0.0.0.0"
cluster_port = 9580
cluster_name = "cameodb-cluster"

# Seed nodes for initial discovery (2-3 nodes recommended)
seed_nodes = []

# Optional: Expected cluster nodes for validation
# Used to compare against discovered nodes and emit warnings if mismatched
# Not used for strict cluster formation, only for operational awareness
# cluster_nodes = [
#     "/ip4/10.0.1.5/tcp/9580",
#     "/ip4/10.0.1.6/tcp/9580",
#     "/ip4/10.0.1.7/tcp/9580"
# ]

[storage]
data_paths = ["/var/lib/cameodb"]
disk_usage_threshold_percent = 90
wal_sync = true
wal_segment_size_mb = 64
default_batch_size = 2000
num_shards_init = 4
max_shards_per_node = 8

# CPU affinity. Writer pinning is neutral and on; the other two measured as regressions
# and are off — see docs/CONFIGURATION.md before changing them.
writer_core_affinity = true
shard_affine_dispatch = false
worker_core_affinity = false

[search]
indexer_memory_min_mb = 32
indexer_memory_max_mb = 512
memory_pressure_threshold_percent = 80
search_threads = 8
enable_streaming_search = true
max_concurrent_shard_searches = 32
max_concurrent_remote_searches = 8
enable_early_termination = true
supervisor_timeout_secs = 5
default_search_limit = 10
