[package]
name = "server"
version = "0.3.8"
edition = "2024"
# FSL-1.1-ALv2 (the SPDX id for FSL-1.1-Apache-2.0): the protected product surface — see
# the root LICENSE. Converts to Apache-2.0 two years after each release.
license = "FSL-1.1-ALv2"
# Never uploaded to a registry: this is the product binary, and an accidental
# `cargo publish --workspace` would put the FSL-licensed source on crates.io irrevocably.
publish = false
description = "A high-performance distributed hybrid-search database"

[lints]
workspace = true

[[bin]]
name = "cameodb"
path = "src/main.rs"

[features]
# Compile-time panic seams for the panic-isolation smoke test. Off by default, so a shipped
# binary carries none of them; the test builds with `--features fault-injection` to drive a real
# panic into each hardened surface and prove the release profile unwinds rather than aborts.
fault-injection = []

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
futures = { workspace = true }
kameo = { workspace = true }
redb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
cameodb_mcp = { path = "../mcp", version = "0.3.8" }
client = { path = "../client", version = "0.3.8" }
cluster = { path = "../cluster", version = "0.3.8" }
storage = { path = "../storage", version = "0.3.8" }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
toml = { workspace = true }
serde-saphyr = { workspace = true }
num_cpus = { workspace = true }
rayon = { workspace = true }
libp2p = { workspace = true, features = ["tokio", "tcp", "noise", "yamux", "quic", "macros", "identify", "dns", "ping"] }
xxhash-rust = { workspace = true }
tokio-util = { workspace = true }
chrono = { version = "0.4.44", features = ["serde"] }
core_affinity = "0.8"
# `compact --rewrite` reads the free disk for its copy: already built for tantivy, default
# features as tantivy has them, and a safe call (raw syscalls on Linux, no unsafe of ours).
fs4 = "0.13"
libc = "0.2"
# API key authentication (crates/server/src/auth.rs). All six were already in Cargo.lock as
# transitive dependencies of rustls, libp2p, and reqwest, so nothing new enters the audit or
# licence surface. `getrandom` rather than `rand`: a key needs 32 bytes of OS entropy once,
# not a seeded generator.
sha2 = "0.11"
subtle = "2.6"
zeroize = "1.9"
hex = "0.4"
base64 = "0.23"
getrandom = "0.4"

[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms", "stats"] }
tikv-jemalloc-sys = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms", "stats"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["stats"] }
tikv-jemalloc-sys = { version = "0.7", features = ["stats"] }

# `cameodb service run`: the node as a Windows service, answering the service control manager.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
tempfile = "3.27.0"
# Integration tests drive the built binary over HTTP. The SDK covers the REST surface, but
# MCP is JSON-RPC over POST and has no SDK method, so those tests speak it directly.
reqwest = { workspace = true }
# To build a compressed request body. The decompression cap on the streaming ingest path
# can only be exercised by a body that is small on the wire and large once inflated, which
# means a test has to compress one. Already in the lockfile — `tower-http`'s decompression
# pulls it in through `async-compression` — so it adds nothing to the dependency or
# advisory surface, and being a dev-dependency it is not in the shipped binary at all.
flate2 = "1.1"
# Self-signed certificates for the TLS reload test, which has to hand the node two different ones.
# Already in the lockfile as a dependency of libp2p's TLS, so it adds nothing to the dependency or
# advisory surface, and being a dev-dependency it is not in the shipped binary.
rcgen = "0.13"

[package.metadata.generate-rpm]
# As for the DEB: without it the package is named after the crate, "server". The build scripts'
# `--set-metadata 'package.name="cameodb"'` never did this — it overrides keys of this table.
name = "cameodb"
release = "1"
assets = [
    # NOTE: cargo-generate-rpm automatically resolves target/release/ to the correct
    # target/<triple>/<profile>/ path when --target and --profile are specified.
    { source = "target/release/cameodb", dest = "/usr/local/bin/cameodb", mode = "755" },
    { source = "cameodb.toml", dest = "/etc/cameodb/cameodb.toml", mode = "644", config = true },
    { source = "cameodb.service", dest = "/usr/lib/systemd/system/cameodb.service", mode = "644" }
]

pre_install_script = """
getent group cameodb >/dev/null || groupadd -r cameodb
getent passwd cameodb >/dev/null || \
    useradd -r -g cameodb -d /var/lib/cameodb -s /sbin/nologin \
    -c "CameoDB User" cameodb
exit 0
"""

post_install_script = """
if [ ! -d /var/lib/cameodb ]; then
    mkdir -p /var/lib/cameodb
fi
chown cameodb:cameodb /var/lib/cameodb
chmod 700 /var/lib/cameodb

# As the DEB: key digests readable by the service but owned by root, a log directory the
# service writes, each created only when missing; the config readable by the service group.
[ -d /etc/cameodb/keys ] || install -d -o root -g cameodb -m 750 /etc/cameodb/keys
[ -d /var/log/cameodb ] || install -d -o cameodb -g cameodb -m 750 /var/log/cameodb
chown root:cameodb /etc/cameodb/cameodb.toml
chmod 640 /etc/cameodb/cameodb.toml

# No systemd (a container, a chroot): the files are in place, nothing to enable.
if [ $1 -eq 1 ] && [ -d /run/systemd/system ]; then
    systemctl daemon-reload
    systemctl preset cameodb.service
fi
"""

pre_uninstall_script = """
if [ $1 -eq 0 ] && [ -d /run/systemd/system ]; then
    systemctl --no-reload disable --now cameodb.service
fi
"""

post_trans_script = """
if [ -d /run/systemd/system ]; then
    systemctl daemon-reload
    systemctl try-restart cameodb.service || {
        echo "cameodb: upgraded, but the service did not restart. See" >&2
        echo "  cameodb check-config -c /etc/cameodb/cameodb.toml" >&2
        echo "  journalctl -u cameodb -n 40" >&2
    }
fi
"""

[package.metadata.deb]
# Without this the control file takes the crate name, so `dpkg -s` and `apt remove` say "server".
# The binary, the unit, /etc/cameodb and /var/lib/cameodb are all `cameodb`; the package is too.
name = "cameodb"
maintainer = "CameoDB Team <team@cameodb.com>"
copyright = "2026, CameoDB Team"
license-file = ["../../LICENSE", "4"]
extended-description = """\
A high-performance distributed hybrid-search database with built-in clustering,
search capabilities, and modern Rust performance optimizations."""
depends = ""
section = "database"
priority = "optional"
# Same config the RPM installs, not ../../cameodb.example.toml. The example file is written for
# running from a checkout — `data_paths = ["./data/cameodb"]` — and cameodb.service sets
# `User=cameodb` with no WorkingDirectory, so systemd starts it from `/`. The DEB therefore
# installed a config pointing at /data/cameodb, which the unprivileged user cannot create,
# while both maintainer scripts prepare /var/lib/cameodb. cameodb.toml uses that absolute path.
assets = [
    ["target/release/cameodb", "usr/local/bin/", "755"],
    ["cameodb.toml", "etc/cameodb/cameodb.toml", "644"],
    ["cameodb.service", "lib/systemd/system/", "644"]
]
conf-files = ["etc/cameodb/cameodb.toml"]
maintainer-scripts = "debian/"