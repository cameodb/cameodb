[package]
name = "server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cameodb"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bincode = { workspace = true }
futures = { workspace = true }
kameo = { workspace = true }
redb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tower = { workspace = true }
tower-http = { workspace = true }
cluster = { path = "../cluster" }
storage = { path = "../storage" }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
num_cpus = { workspace = true }
# Note: if-addrs and if-watch removed with mDNS cleanup - no longer needed for Kademlia-only mode
libp2p = { workspace = true, features = ["tokio", "tcp", "noise", "yamux", "quic", "macros"] }

[dev-dependencies]
tempfile = "3.8"
axum-test = "15.0"
