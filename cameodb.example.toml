[node]
label = "cameo-node-01"
zone = "default"

# Security posture preset. Declares how far this node can be reached; the server enforces
# the matching rules at startup and refuses to boot if the rest of this file contradicts
# them. Verify without starting the node: `cameodb check-config -c <file>`.
#
#   local    reachable only from this machine; permissive CORS allowed; warnings, not errors
#   internal reachable on a trusted network; explicit CORS origins; cluster PSK required
#   external reachable from an untrusted network; TLS required; /_admin/* off;
#            authentication required
#
# Pick by who can reach the bind address, not by what the box is for: a shared test
# environment is "internal", not "local", however early the project.
#
# Omitting this is only valid for a loopback bind_address, which infers "local".
profile = "internal"

[network.http]
bind_address = "0.0.0.0"
port = 9480
request_timeout_secs = 30
max_body_size_mb = 64
max_concurrent_requests = 128
# Browser origins allowed to call this node, e.g. ["https://console.example.com"].
# Empty = no cross-origin browser access (does not affect API/MCP clients).
# "*" is accepted only under the local profile.
cors_allowed_origins = []

# Mount the /_admin/* routes (memory purge, writer eviction). Off removes them entirely
# rather than refusing them. When [security] is enabled they require a node-admin key.
admin_enabled = true

# Authentication. Off by default; when on, every route except /_cluster/health requires
# `Authorization: Bearer <key>`. Only digests are stored here, so this file never holds a
# usable credential — mint keys with `cameodb keygen --role <admin|writer|reader>`, which
# prints the key once and the stanza to paste. Add --hash-out <path> and --key-out <path> to
# write the digest and the key as 0600 files instead of copying them by hand.
#
# A key is scoped by its role and, optionally, by allowed_indexes — which holds through
# enumeration too: /_indexes and the MCP catalog return only what a key may see. MCP is
# authorized per tool and per index, and a session belongs to the key that opened it.
[security]
enabled = false

# [[security.api_keys]]
# key_hash = "sha256:…"                 # or: key_hash_file = "/etc/cameodb/keys/ops"
# role = "admin"                        # admin | writer | reader
# label = "ops-team"                    # audit identity in logs; not a secret
#
# [[security.api_keys]]
# key_hash_file = "/etc/cameodb/keys/team-a"
# role = "writer"
# label = "team-a"
# allowed_indexes = ["docs", "wiki"]    # honored for every role; omit to allow all

# What one caller may spend on MCP tool calls. Off by default.
#
# Aimed at a legitimate key held by an AI agent that loops: every call is authorized, and
# the capability model has nothing to say about how often. A token bucket, so a burst is
# allowed through and the sustained rate is metered — which is the shape agent traffic
# actually has. Metered per key, so one noisy agent cannot refuse another.
# [security.limits]
# tool_calls_per_minute = 120           # 0 (default) disables limiting entirely
# tool_call_burst = 30                  # spendable at once; 0 means one minute's worth

[network.cluster]
enabled = false
bind_address = "0.0.0.0"
cluster_port = 9580
cluster_name = "cameodb-cluster"

# Seed nodes for initial discovery (2-3 nodes recommended)
seed_nodes = []

# Optional: Expected cluster nodes for validation
# Used to compare against discovered nodes and emit warnings if mismatched
# Not used for strict cluster formation, only for operational awareness
# cluster_nodes = [
#     "/ip4/10.0.1.5/tcp/9580",
#     "/ip4/10.0.1.6/tcp/9580",
#     "/ip4/10.0.1.7/tcp/9580"
# ]

# Cluster pre-shared key (PSK) for private network encryption.
# When set, all TCP connections are wrapped with XSalsa20 encryption.
# Peers without the matching key cannot join the cluster.
# QUIC is automatically disabled when PSK is enabled (pnet only supports TCP).
# Generate with: openssl rand -hex 32
# psk = "a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890"
# Alternatively, load from a file (useful for restricted permissions):
# psk_file = "/etc/cameodb/cluster.psk"

[storage]
data_paths = ["./data/cameodb"]
disk_usage_threshold_percent = 90
wal_sync = true
wal_segment_size_mb = 64
default_batch_size = 5000
num_shards_init = 4
max_shards_per_node = 8

# Pin each shard's writer thread to the core matching its placement ordinal, keeping that
# shard's redb and tantivy structures cache-hot. Measured neutral; a no-op on macOS.
writer_core_affinity = true

# The two flags below are measured regressions on an 8-core node. They are here so the
# choice is visible rather than hidden in a default. Leave them false unless you are
# measuring them yourself with `cameodb-bench`. See docs/CONFIGURATION.md.
#
# Route a shard's operations to the worker with the same ordinal: -13 to -20% write
# throughput, write p90 roughly doubled.
shard_affine_dispatch = false
# Additionally pin each worker to its own core: -15% search throughput, search p99 roughly
# doubled. Requires both flags above to have any effect.
worker_core_affinity = false

[search]
indexer_memory_min_mb = 32
indexer_memory_max_mb = 512
total_memory_limit_mb = 4096
memory_pressure_threshold_percent = 80
search_threads = 8
enable_streaming_search = true
max_concurrent_shard_searches = 32
max_concurrent_remote_searches = 8
enable_early_termination = true
supervisor_timeout_secs = 5
default_search_limit = 10