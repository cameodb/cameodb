[node]
label = "cameo-node-01"
zone = "default"

# Security posture preset. Declares how far this node can be reached; the server enforces
# the matching rules at startup and refuses to boot if the rest of this file contradicts
# them. Verify without starting the node: `cameodb check-config -c <file>`.
#
#   local    reachable only from this machine; permissive CORS allowed; warnings, not errors
#   internal reachable on a trusted network; explicit CORS origins; cluster PSK required
#   external reachable from an untrusted network; TLS required; /_admin/* off;
#            authentication required
#
# Pick by who can reach the bind address, not by what the box is for: a shared test
# environment is "internal", not "local", however early the project.
#
# Omitting this is only valid for a loopback bind_address, which infers "local".
profile = "internal"

[network.http]
bind_address = "0.0.0.0"
port = 9480
request_timeout_secs = 30
# In-flight bodies are held in memory, so this multiplied by the body ceiling has to fit inside
# limits.total_memory_limit_mb below. 32 x 128 MB = 4096 MB, which is exactly the budget; at the
# 128 this file used to carry, the same arithmetic came to 16 GB against a 4 GB limit and
# `cameodb check-config` said so. Raise them together.
max_concurrent_requests = 32
# Browser origins allowed to call this node, e.g. ["https://console.example.com"].
# Empty = no cross-origin browser access (does not affect API/MCP clients).
# "*" is accepted only under the local profile.
cors_allowed_origins = []

# Mount the /_admin/* routes (memory purge, writer eviction). Off removes them entirely
# rather than refusing them. When [security] is enabled they require a node-admin key.
admin_enabled = true

# Authentication. Off by default; when on, every route except /_cluster/health requires
# `Authorization: Bearer <key>`. Only digests are stored here, so this file never holds a
# usable credential — mint keys with `cameodb keygen --role <admin|writer|reader>`, which
# prints the key once and the stanza to paste. Add --hash-out <path> and --key-out <path> to
# write the digest and the key as 0600 files instead of copying them by hand.
#
# A key is scoped by its role and, optionally, by allowed_indexes — which holds through
# enumeration too: /_indexes and the MCP catalog return only what a key may see. MCP is
# authorized per tool and per index, and a session belongs to the key that opened it.
# How large a thing may get on this node, as opposed to what one caller may ask for — that is
# [security.limits] below. max_record_size_mb is the source of truth: the HTTP body ceiling, the
# inter-node message size, the request timeout and the largest MCP response all derive from it,
# so raising it for large documents moves them together. `cameodb check-config` prints what each
# one resolved to.
[limits]
max_record_size_mb = 64
# 0 derives it from max_record_size_mb (+64 MB for framing). Set it to pin the body ceiling on
# its own; max_concurrent_requests multiplied by it has to fit inside total_memory_limit_mb,
# because in-flight bodies are held in memory.
max_body_size_mb = 0
# The node's memory budget: the indexer pool is sized from it and startup weighs the body
# ceiling against it.
total_memory_limit_mb = 4096
# Largest MCP search response in bytes. Unset it follows the body ceiling; set it below that
# where the callers are agents whose context is smaller than what the node can send.
# max_response_bytes = 16777216

[security]
enabled = false

# This node is reachable off-box — profile = "internal" with a non-loopback bind — so with
# authentication off every route, including /_admin/*, is open to anyone who can reach the
# port. The node starts and warns; `cameodb check-config` exits non-zero, so a deploy step
# gates on it. To close it, mint a key:
#   cameodb keygen --role admin --label ops \
#     --hash-out /etc/cameodb/keys/ops --key-out ~/.cameodb/ops.key
# then set enabled = true above and add the matching [[security.api_keys]] entry.

# [[security.api_keys]]
# key_hash = "sha256:…"                 # or: key_hash_file = "/etc/cameodb/keys/ops"
# role = "admin"                        # admin | writer | reader
# label = "ops-team"                    # audit identity in logs; not a secret
#
# [[security.api_keys]]
# key_hash_file = "/etc/cameodb/keys/team-a"
# role = "writer"
# label = "team-a"
# allowed_indexes = ["docs", "wiki"]    # honored for every role; omit to allow all

# What one caller may spend on MCP tool calls. Off by default.
#
# Aimed at a legitimate key held by an AI agent that loops: every call is authorized, and
# the capability model has nothing to say about how often. A token bucket, so a burst is
# allowed through and the sustained rate is metered — which is the shape agent traffic
# actually has. Metered per key, so one noisy agent cannot refuse another.
# [security.limits]
# tool_calls_per_minute = 120           # 0 (default) disables limiting entirely
# tool_call_burst = 30                  # spendable at once; 0 means one minute's worth
# max_search_limit = 10000              # largest `limit` an MCP search may ask for
# max_federated_indexes = 20            # most indexes one search_across_indexes may name

# The MCP endpoint itself: which of it is mounted, and how long a conversation with it lives.
#
# Distinct from [security.limits] above, which meters what one key may spend. Nothing here
# changes what a client is told — the protocol is the same either way.
#
# session_idle_timeout_secs is the setting to reach for when a paused agent comes back to
# "session terminated (404). need to re-initialize". Idle means nothing arrived AND no stream
# is open: a client holding its listening stream open never expires, however long it pauses,
# so this is the gap a *disconnected* client may leave and still find its session. A session
# holds no conversation state — an id, a clock and the key that owns it — so holding one for
# half an hour costs almost nothing; max_sessions is what bounds the memory.
[mcp]
enabled = true
session_idle_timeout_secs = 1800
max_sessions = 1024
# How often an idle SSE stream is written to. Has to be below the shortest idle-read timeout
# between this node and its clients — 30 s on nginx by default, 60 s on an AWS ALB — and below
# session_idle_timeout_secs, or a stream cannot hold its own session open.
sse_keepalive_secs = 15
# The superseded 2024-11-05 transport, /mcp/sse and /mcp/messages. Current clients negotiate
# Streamable HTTP on /mcp and never touch these; false unmounts them rather than refusing them.
# Note that transport ties a session to one TCP connection: it never idles out, but the session
# dies the moment the connection does, where a Streamable HTTP one survives the reconnect.
legacy_sse_enabled = true

# Audit trail — who read what. Refusals have always been logged; without this a node cannot
# say who legitimately read which index, which is the question an incident asks. Reads and
# MCP tool calls keep a line each; writes are counted per key and index, because a knowledge
# base ingests far more than it retrieves and one line per write buries everything else.
# Never on the request path: a dedicated thread does the writing. Read it back with
# GET /_admin/audit (node-admin), or from the file with jq.
# [security.audit]
# enabled = true
# file = "/var/log/cameodb/audit.jsonl"  # optional; without it the trail dies with the node
# buffer_capacity = 2048                 # records kept for /_admin/audit
# max_file_bytes = 104857600             # rotate past 100 MiB, keeping max_files generations
# max_files = 5
# rollup_secs = 10                       # how often counted totals are flushed
# record_query_text = false              # a search for a name RECORDS that name — see docs

[network.cluster]
enabled = false
bind_address = "0.0.0.0"
cluster_port = 9580
cluster_name = "cameodb-cluster"

# Seed nodes for initial discovery (2-3 nodes recommended)
seed_nodes = []

# Optional: Expected cluster nodes for validation
# Used to compare against discovered nodes and emit warnings if mismatched
# Not used for strict cluster formation, only for operational awareness
# cluster_nodes = [
#     "/ip4/10.0.1.5/tcp/9580",
#     "/ip4/10.0.1.6/tcp/9580",
#     "/ip4/10.0.1.7/tcp/9580"
# ]

# Cluster pre-shared key (PSK) for private network encryption.
# When set, all TCP connections are wrapped with XSalsa20 encryption.
# Peers without the matching key cannot join the cluster.
# QUIC is automatically disabled when PSK is enabled (pnet only supports TCP).
# Generate with: openssl rand -hex 32
# psk = "a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890"
# Alternatively, load from a file (useful for restricted permissions):
# psk_file = "/etc/cameodb/cluster.psk"

[storage]
data_paths = ["./data/cameodb"]
disk_usage_threshold_percent = 90
# fsync every redb commit. Leave this on: with it off, a crash can leave the search index
# holding documents the document store lost, which recovery cannot repair.
wal_sync = true
wal_segment_size_mb = 64
default_batch_size = 5000
num_shards_init = 4
max_shards_per_node = 8

# Pin each shard's writer thread to the core matching its placement ordinal, keeping that
# shard's redb and tantivy structures cache-hot. Measured neutral; a no-op on macOS.
writer_core_affinity = true

# The two flags below are measured regressions on an 8-core node. They are here so the
# choice is visible rather than hidden in a default. Leave them false unless you are
# measuring them yourself with `cameodb-bench`. See docs/CONFIGURATION.md.
#
# Route a shard's operations to the worker with the same ordinal: -13 to -20% write
# throughput, write p90 roughly doubled.
shard_affine_dispatch = false
# Additionally pin each worker to its own core: -15% search throughput, search p99 roughly
# doubled. Requires both flags above to have any effect.
worker_core_affinity = false

[search]
indexer_memory_min_mb = 32
indexer_memory_max_mb = 512
memory_pressure_threshold_percent = 80
search_threads = 8
enable_streaming_search = true
max_concurrent_shard_searches = 32
max_concurrent_remote_searches = 8
# Accepted and inert. It gated one `break` in the streaming merge that could only fire when no
# work remained to skip, and that discarded a source's results after they had already arrived —
# so any search whose limit was below the match count lost a whole node from both its count and
# its merge. Setting it either way changes nothing now.
enable_early_termination = true
supervisor_timeout_secs = 5
default_search_limit = 10