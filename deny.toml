    { id = "RUSTSEC-2026-0490", reason = "transitive via libp2p 0.56.0; needs hickory-proto >=0.26.2 (libp2p 0.57), and kameo 0.22.2 still pins libp2p 0.56 (rechecked 2026-11-11: 0.22.2 is the latest kameo; its unreleased main uses libp2p 0.57); review-by 2027-03-31" },
