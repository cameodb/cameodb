[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "EPL-2.0",
    # Own product crate (crates/server): Functional Source License 1.1 with the Apache-2.0
    # future grant. No dependency is under it — this entry covers the workspace member
    # itself.
    "FSL-1.1-ALv2",
    "bzip2-1.0.6",
    # Mozilla's CA certificate bundle, shipped by webpki-root-certs via
    # rustls-platform-verifier. CDLA-Permissive-2.0 is a permissive *data* licence with no
    # copyleft or attribution burden — appropriate for a trust store, and reviewed as such.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
