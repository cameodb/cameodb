# cargo-deny configuration
# Run: cargo deny check

[output]
feature-depth = 1

[advisories]
# Each exception carries a `review-by <date>` in its reason. scripts/validate/deps.sh
# fails once that date passes, so an exception has to be renewed deliberately instead of
# outliving the problem it was granted for.
ignore = [
    # hickory-proto 0.25.x vulnerabilities — transitive via libp2p 0.56.0.
    # Fix requires hickory-proto >=0.26.2, which libp2p hasn't adopted yet.
    { id = "RUSTSEC-2026-0118", reason = "transitive via libp2p 0.56.0; needs hickory-proto >=0.26.1 (libp2p 0.57), and kameo 0.22.2 still pins libp2p 0.56 (rechecked 2026-11-09: 0.22.2 is the latest kameo); review-by 2027-03-31" },
    { id = "RUSTSEC-2026-0119", reason = "transitive via libp2p 0.56.0; needs hickory-proto >=0.26.1 (libp2p 0.57), and kameo 0.22.2 still pins libp2p 0.56 (rechecked 2026-11-09: 0.22.2 is the latest kameo); review-by 2027-03-31" },
    # 0491 is reachable from an untrusted DNS/mDNS packet (memory amplification on decode); 0487, 0489 and 0490
    # are panics when parsing SVCB/HTTPS records or zone files from text, which libp2p never does with peer input.
    { id = "RUSTSEC-2026-0491", reason = "transitive via libp2p 0.56.0; needs hickory-proto >=0.26.2 (libp2p 0.57), and kameo 0.22.2 still pins libp2p 0.56 (rechecked 2026-11-11: 0.22.2 is the latest kameo; its unreleased main uses libp2p 0.57); review-by 2027-03-31" },
    { id = "RUSTSEC-2026-0487", reason = "transitive via libp2p 0.56.0; needs hickory-proto >=0.26.2 (libp2p 0.57), and kameo 0.22.2 still pins libp2p 0.56 (rechecked 2026-11-11: 0.22.2 is the latest kameo; its unreleased main uses libp2p 0.57); review-by 2027-03-31" },
