[server.http]
port = 9480
host = "0.0.0.0"
request_timeout_secs = 30
max_body_size_mb = 200
cors_enabled = true

[server.node]
max_shards = 8
init_shards = 4

[storage]
data_paths = ["./data/cameodb"]
disk_usage_threshold = 0.9
wal_sync = true
wal_segment_size_mb = 64
default_batch_size = 1000

[search]
writer_memory_min_mb = 16
writer_memory_max_mb = 256
total_memory_limit_mb = 2048
memory_pressure_threshold = 0.8
search_threads = 8

[cluster]
cluster_name = "cameodb-cluster"
distributed_actors = true
cluster_port = 9580
bootstrap_nodes = []

