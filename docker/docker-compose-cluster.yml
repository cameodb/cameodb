services:
  # ==========================================
  # NODE 1 (Seed Node)
  # ==========================================
  cameodb-node1:
    build: 
      context: ..
      dockerfile: Dockerfile
      secrets:
        - zscaler
    image: cameodb:latest
    container_name: cameodb-node1
    user: "65532:65532"
    
    environment:
      - RUST_LOG=debug
      - CAMEODB_NODE_LABEL=cameodb-node-1
      - CAMEODB_CLUSTER_NAME=cameodb-production
      - CAMEODB_CLUSTER_ENABLED=true
      - CAMEODB_HTTP_BIND_ADDRESS=cameodb-node1
      - CAMEODB_HTTP_PORT=9480
      - CAMEODB_CLUSTER_BIND_ADDRESS=cameodb-node1
      - CAMEODB_CLUSTER_PORT=9580
      - CAMEODB_SEED_NODES=cameodb-node1:9580,cameodb-node2:9580
      - CAMEODB_CLUSTER_NODES=cameodb-node1:9580,cameodb-node2:9580,cameodb-node3:9580
      - CAMEODB_MAX_BODY_SIZE_MB=200
      - CAMEODB_DEFAULT_BATCH_SIZE=200
    
    ports:
      - "9481:9480"
      - "9581:9580"
    
    volumes:
      - ../data/cameodb/node1:/data/cameodb
      # Optional Config override
      # - ./config/node1.toml:/etc/cameodb/cameodb.toml:ro
    
    networks:
      cameodb-cluster:
        ipv4_address: 172.20.0.10
    
    healthcheck:
      test: ["CMD", "/usr/local/bin/cameodb", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # NODE 2
  # ==========================================
  cameodb-node2:
    build: 
      context: ..
      dockerfile: Dockerfile
      secrets:
        - zscaler
    image: cameodb:latest
    container_name: cameodb-node2
    user: "65532:65532"
    
    environment:
      - RUST_LOG=debug
      - CAMEODB_NODE_LABEL=cameodb-node-2
      - CAMEODB_CLUSTER_NAME=cameodb-production
      - CAMEODB_CLUSTER_ENABLED=true
      - CAMEODB_HTTP_BIND_ADDRESS=cameodb-node2
      - CAMEODB_HTTP_PORT=9480
      - CAMEODB_CLUSTER_BIND_ADDRESS=cameodb-node2
      - CAMEODB_CLUSTER_PORT=9580
      - CAMEODB_SEED_NODES=cameodb-node1:9580,cameodb-node2:9580
      - CAMEODB_CLUSTER_NODES=cameodb-node1:9580,cameodb-node2:9580,cameodb-node3:9580
      - CAMEODB_MAX_BODY_SIZE_MB=200
      - CAMEODB_DEFAULT_BATCH_SIZE=200
    
    ports:
      - "9482:9480"
      - "9582:9580"
    
    volumes:
      - ../data/cameodb/node2:/data/cameodb
    
    networks:
      cameodb-cluster:
        ipv4_address: 172.20.0.11
    
    healthcheck:
      test: ["CMD", "/usr/local/bin/cameodb", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
    
    depends_on:
      cameodb-node1:
        condition: service_healthy

  # ==========================================
  # NODE 3
  # ==========================================
  cameodb-node3:
    build: 
      context: ..
      dockerfile: Dockerfile
      secrets:
        - zscaler
    image: cameodb:latest
    container_name: cameodb-node3
    user: "65532:65532"
    
    environment:
      - RUST_LOG=debug
      - CAMEODB_NODE_LABEL=cameodb-node-3
      - CAMEODB_CLUSTER_NAME=cameodb-production
      - CAMEODB_CLUSTER_ENABLED=true
      - CAMEODB_HTTP_BIND_ADDRESS=cameodb-node3
      - CAMEODB_HTTP_PORT=9480
      - CAMEODB_CLUSTER_BIND_ADDRESS=cameodb-node3
      - CAMEODB_CLUSTER_PORT=9580
      - CAMEODB_SEED_NODES=cameodb-node1:9580,cameodb-node2:9580
      - CAMEODB_CLUSTER_NODES=cameodb-node1:9580,cameodb-node2:9580,cameodb-node3:9580
      - CAMEODB_MAX_BODY_SIZE_MB=200
      - CAMEODB_DEFAULT_BATCH_SIZE=200
    
    ports:
      - "9483:9480"
      - "9583:9580"
    
    volumes:
      - ../data/cameodb/node3:/data/cameodb
    
    networks:
      cameodb-cluster:
        ipv4_address: 172.20.0.12
    
    healthcheck:
      test: ["CMD", "/usr/local/bin/cameodb", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
    
    depends_on:
      cameodb-node1:
        condition: service_healthy

  # ==========================================
  # LOAD BALANCER
  # ==========================================
  nginx-lb:
    image: nginx:alpine
    container_name: cameodb-lb
    ports:
      - "9480:80"
    networks:
      - cameodb-cluster
    depends_on:
      - cameodb-node1
      - cameodb-node2
      - cameodb-node3
    command: |
      /bin/sh -c "
      echo 'upstream cameodb_cluster {
          server cameodb-node1:9480;
          server cameodb-node2:9480;
          server cameodb-node3:9480;
      }
      server {
          listen 80;
          # Allow larger batch writes (adjust as needed)
          client_max_body_size 200M;
          client_body_buffer_size 16M;
          location / {
              proxy_pass http://cameodb_cluster;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
              proxy_request_buffering off;
          }
      }' > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'
      "

networks:
  cameodb-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

secrets:
  zscaler:
    file: /usr/local/share/ca-certificates/Zscaler.crt