# Docker Compose for Distributed CameoDB Deployment
# 
# This configuration demonstrates how to deploy a 3-node CameoDB cluster
# with distributed actors using Kameo's remote actor system.
# Optimized for Docker Desktop on macOS
#
# Port Mapping Strategy:
# - HTTP API (external): 9481, 9482, 9483 -> 9480 (internal)
# - Cluster Communication: 9581, 9582, 9583 -> 9580 (internal)
# - Load Balancer: 9480 -> simple proxy to external ports 9481, 9482, 9483
#
# Usage:
#   cd docker && docker-compose up -d
#   curl http://localhost:9481/api/books/search  # Direct Node 1
#   curl http://localhost:9482/api/books/search  # Direct Node 2  
#   curl http://localhost:9483/api/books/search  # Direct Node 3
#   curl http://localhost:9480/api/books/search  # Load balanced (simple proxy)

networks:
  cameodb-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  cameodb-node1:
    build: 
      context: ..
      dockerfile: Dockerfile
    image: cameodb:latest
    container_name: cameodb-node1
    hostname: node1.cameodb.local
    environment:
      - NODE_ID=node1
      - CLUSTER_NAME=cameodb-production
      - CLUSTER_PORT=9580
      - DISTRIBUTED_ACTORS=true
      - BOOTSTRAP_NODES=node2.cameodb.local:9580,node3.cameodb.local:9580
      - MDNS_DISCOVERY=true
      - HTTP_PORT=9480
      - INIT_SHARDS=2
    user: "${CURRENT_UID}:${CURRENT_GID}"
    ports:
      - "9481:9480"  # HTTP API (external:internal)
      - "9581:9580"  # Cluster communication (libp2p)
    volumes:
      - ../data/cameodb/node1:/data/cameodb
      - ./config/node1.toml:/etc/cameodb/config.toml:ro
    networks:
      cameodb-cluster:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9480/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  cameodb-node2:
    build: 
      context: ..
      dockerfile: Dockerfile
    image: cameodb:latest
    container_name: cameodb-node2
    hostname: node2.cameodb.local
    environment:
      - NODE_ID=node2
      - CLUSTER_NAME=cameodb-production
      - CLUSTER_PORT=9580
      - DISTRIBUTED_ACTORS=true
      - BOOTSTRAP_NODES=node1.cameodb.local:9580,node3.cameodb.local:9580
      - MDNS_DISCOVERY=true
      - HTTP_PORT=9480
      - INIT_SHARDS=2
    user: "${CURRENT_UID}:${CURRENT_GID}"
    ports:
      - "9482:9480"  # HTTP API (external:internal)
      - "9582:9580"  # Cluster communication (libp2p)
    volumes:
      - ../data/cameodb/node2:/data/cameodb
      - ./config/node2.toml:/etc/cameodb/config.toml:ro
    networks:
      cameodb-cluster:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9480/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      cameodb-node1:
        condition: service_healthy

  cameodb-node3:
    build: 
      context: ..
      dockerfile: Dockerfile
    image: cameodb:latest
    container_name: cameodb-node3
    hostname: node3.cameodb.local
    environment:
      - NODE_ID=node3
      - CLUSTER_NAME=cameodb-production
      - CLUSTER_PORT=9580
      - DISTRIBUTED_ACTORS=true
      - BOOTSTRAP_NODES=node1.cameodb.local:9580,node2.cameodb.local:9580
      - MDNS_DISCOVERY=true
      - HTTP_PORT=9480
      - INIT_SHARDS=2
    user: "${CURRENT_UID}:${CURRENT_GID}"
    ports:
      - "9483:9480"  # HTTP API (external:internal)
      - "9583:9580"  # Cluster communication (libp2p)
    volumes:
      - ../data/cameodb/node3:/data/cameodb
      - ./config/node3.toml:/etc/cameodb/config.toml:ro
    networks:
      cameodb-cluster:
        ipv4_address: 172.20.0.12
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9480/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      cameodb-node1:
        condition: service_healthy

  # Simple load balancer using external ports
  nginx-lb:
    image: nginx:alpine
    container_name: cameodb-lb
    user: "${CURRENT_UID}:${CURRENT_GID}"
    ports:
      - "9480:80"   # Main load-balanced endpoint
    command: |
      /bin/sh -c "
      echo 'upstream cameodb_cluster {
          server host.docker.internal:9481;
          server host.docker.internal:9482;
          server host.docker.internal:9483;
      }
      server {
          listen 80;
          location / {
              proxy_pass http://cameodb_cluster;
              proxy_set_header Host \$$host;
              proxy_set_header X-Real-IP \$$remote_addr;
          }
      }' > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'
      "

volumes:
  node1-data:
    driver: local
  node2-data:
    driver: local
  node3-data:
    driver: local








