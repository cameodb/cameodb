services:
  # ==========================================
  # NODE 1 (Seed Node)
  # ==========================================
  cameodb-node1:
    build: 
      context: ..
      dockerfile: Dockerfile
      args:
        # Part of the CA layer's cache key; the secret itself is not. Without it a build that
        # supplies a CA reuses the cached layer from one that did not. See the Dockerfile.
        CORPORATE_CA_ID: ${CAMEODB_CA_CERT:-none}
      secrets:
        - corporate-ca
    image: cameodb:latest
    container_name: cameodb-node1
    user: "65532:65532"
    
    environment:
      - RUST_LOG=debug
      - CAMEODB_NODE_LABEL=cameodb-node-1
      - CAMEODB_CLUSTER_NAME=cameodb-production
      - CAMEODB_CLUSTER_ENABLED=true
      - CAMEODB_HTTP_BIND_ADDRESS=cameodb-node1
      - CAMEODB_HTTP_PORT=9480
      - CAMEODB_CLUSTER_BIND_ADDRESS=cameodb-node1
      - CAMEODB_CLUSTER_PORT=9580
      - CAMEODB_SEED_NODES=cameodb-node1:9580,cameodb-node2:9580
      - CAMEODB_CLUSTER_NODES=cameodb-node1:9580,cameodb-node2:9580,cameodb-node3:9580
      - CAMEODB_STORAGE_DEFAULT_BATCH_SIZE=5000
      # Every node in a cluster must carry the same key, and the "internal" profile refuses
      # to start a clustered node without one. The default below is a throwaway for this
      # compose file and nothing else — generate a real one for anything that outlives it:
      #   CAMEODB_CLUSTER_PSK=$(openssl rand -hex 32) docker compose -f docker-compose-cluster.yml up
      - CAMEODB_CLUSTER_PSK=${CAMEODB_CLUSTER_PSK:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
    
    ports:
      - "9481:9480"
      - "9581:9580"
    
    volumes:
      - ../data/cameodb/node1:/data/cameodb
      # Optional Config override
      # - ./config/node1.toml:/etc/cameodb/cameodb.toml:ro
    
    networks:
      cameodb-cluster:
        ipv4_address: 172.20.0.10
    
    healthcheck:
      test: ["CMD", "/usr/local/bin/cameodb", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # NODE 2
  # ==========================================
  cameodb-node2:
    build: 
      context: ..
      dockerfile: Dockerfile
      args:
        # Part of the CA layer's cache key; the secret itself is not. Without it a build that
        # supplies a CA reuses the cached layer from one that did not. See the Dockerfile.
        CORPORATE_CA_ID: ${CAMEODB_CA_CERT:-none}
      secrets:
        - corporate-ca
    image: cameodb:latest
    container_name: cameodb-node2
    user: "65532:65532"
    
    environment:
      - RUST_LOG=debug
      - CAMEODB_NODE_LABEL=cameodb-node-2
      - CAMEODB_CLUSTER_NAME=cameodb-production
      - CAMEODB_CLUSTER_ENABLED=true
      - CAMEODB_HTTP_BIND_ADDRESS=cameodb-node2
      - CAMEODB_HTTP_PORT=9480
      - CAMEODB_CLUSTER_BIND_ADDRESS=cameodb-node2
      - CAMEODB_CLUSTER_PORT=9580
      - CAMEODB_SEED_NODES=cameodb-node1:9580,cameodb-node2:9580
      - CAMEODB_CLUSTER_NODES=cameodb-node1:9580,cameodb-node2:9580,cameodb-node3:9580
      - CAMEODB_STORAGE_DEFAULT_BATCH_SIZE=5000
      # Every node in a cluster must carry the same key, and the "internal" profile refuses
      # to start a clustered node without one. The default below is a throwaway for this
      # compose file and nothing else — generate a real one for anything that outlives it:
      #   CAMEODB_CLUSTER_PSK=$(openssl rand -hex 32) docker compose -f docker-compose-cluster.yml up
      - CAMEODB_CLUSTER_PSK=${CAMEODB_CLUSTER_PSK:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
    
    ports:
      - "9482:9480"
      - "9582:9580"
    
    volumes:
      - ../data/cameodb/node2:/data/cameodb
    
    networks:
      cameodb-cluster:
        ipv4_address: 172.20.0.11
    
    healthcheck:
      test: ["CMD", "/usr/local/bin/cameodb", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
    
    depends_on:
      cameodb-node1:
        condition: service_healthy

  # ==========================================
  # NODE 3
  # ==========================================
  cameodb-node3:
    build: 
      context: ..
      dockerfile: Dockerfile
      args:
        # Part of the CA layer's cache key; the secret itself is not. Without it a build that
        # supplies a CA reuses the cached layer from one that did not. See the Dockerfile.
        CORPORATE_CA_ID: ${CAMEODB_CA_CERT:-none}
      secrets:
        - corporate-ca
    image: cameodb:latest
    container_name: cameodb-node3
    user: "65532:65532"
    
    environment:
      - RUST_LOG=debug
      - CAMEODB_NODE_LABEL=cameodb-node-3
      - CAMEODB_CLUSTER_NAME=cameodb-production
      - CAMEODB_CLUSTER_ENABLED=true
      - CAMEODB_HTTP_BIND_ADDRESS=cameodb-node3
      - CAMEODB_HTTP_PORT=9480
      - CAMEODB_CLUSTER_BIND_ADDRESS=cameodb-node3
      - CAMEODB_CLUSTER_PORT=9580
      - CAMEODB_SEED_NODES=cameodb-node1:9580,cameodb-node2:9580
      - CAMEODB_CLUSTER_NODES=cameodb-node1:9580,cameodb-node2:9580,cameodb-node3:9580
      - CAMEODB_STORAGE_DEFAULT_BATCH_SIZE=5000
      # Every node in a cluster must carry the same key, and the "internal" profile refuses
      # to start a clustered node without one. The default below is a throwaway for this
      # compose file and nothing else — generate a real one for anything that outlives it:
      #   CAMEODB_CLUSTER_PSK=$(openssl rand -hex 32) docker compose -f docker-compose-cluster.yml up
      - CAMEODB_CLUSTER_PSK=${CAMEODB_CLUSTER_PSK:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
    
    ports:
      - "9483:9480"
      - "9583:9580"
    
    volumes:
      - ../data/cameodb/node3:/data/cameodb
    
    networks:
      cameodb-cluster:
        ipv4_address: 172.20.0.12
    
    healthcheck:
      test: ["CMD", "/usr/local/bin/cameodb", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
    
    depends_on:
      cameodb-node1:
        condition: service_healthy

  # ==========================================
  # LOAD BALANCER
  # ==========================================
  nginx-lb:
    image: nginx:alpine
    container_name: cameodb-lb
    ports:
      - "9480:80"
    networks:
      - cameodb-cluster
    depends_on:
      - cameodb-node1
      - cameodb-node2
      - cameodb-node3
    # client_max_body_size below is the node's own ceiling, derived from
    # limits.max_record_size_mb (64) + 64 MB of framing. A larger value here only moves the
    # rejection from nginx to the node.
    #
    # Keep prose out of the config string itself: it is written by `echo '...'`, so one
    # apostrophe closes the quote and the remainder of the line becomes shell. That is not a
    # broken comment but a container that never starts — `sh` reported `unexpected "("` from
    # the `(64)` above and exited 2, leaving the cluster with no load balancer on :9480.
    command: |
      /bin/sh -c "
      echo 'upstream cameodb_cluster {
          server cameodb-node1:9480;
          server cameodb-node2:9480;
          server cameodb-node3:9480;
      }
      server {
          listen 80;
          client_max_body_size 128M;
          client_body_buffer_size 64M;
          location / {
              proxy_pass http://cameodb_cluster;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_read_timeout 120s;
              proxy_send_timeout 120s;
              proxy_request_buffering off;
          }
      }' > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'
      "

networks:
  cameodb-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

secrets:
  # Must be named `corporate-ca`: that is the secret id the Dockerfile mounts. A mismatch is
  # silent — the build simply reports "No corporate CA certificate provided" and produces an
  # image that cannot reach a TLS-intercepting proxy.
  #
  # Behind a TLS-intercepting proxy, point CAMEODB_CA_CERT at your CA file (Zscaler,
  # Netskope, an internal root, …):
  #   CAMEODB_CA_CERT=/usr/local/share/ca-certificates/corporate-ca.crt docker compose build
  # The default is /dev/null, so a build with no corporate CA needs nothing set: the mount
  # succeeds, the file is empty, and the Dockerfile skips it.
  corporate-ca:
    file: ${CAMEODB_CA_CERT:-/dev/null}