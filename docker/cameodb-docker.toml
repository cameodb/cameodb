[node]
label = "cameodb-docker-node"
zone = "default"
# Declare how far this node can be reached: local | internal | external.
# The profile is asserted, not applied — a config that contradicts it refuses to start.
# A published port on a shared host is "internal" at least; only a machine nobody else can
# reach is "local". `cameodb check-config -c /etc/cameodb/cameodb.toml` reports the rules.
#
# "internal" and not "local": a published container port is reachable from the host's
# network, so this node cannot claim to be loopback-only. A node with no profile and a
# non-loopback bind refuses to start rather than guessing.
profile = "internal"

[network.http]
bind_address = "0.0.0.0"
port = 9480
request_timeout_secs = 30
# In-flight bodies are held in memory, so this multiplied by the body ceiling has to fit
# inside limits.total_memory_limit_mb below. 32 x 128 MB = 4096 MB, which is exactly the
# budget; `cameodb check-config` warns when the product exceeds it. Raise them together.
max_concurrent_requests = 32
# Empty means no browser origin is allowed, which is what a node with no web UI wants.
# The "internal" and "external" profiles both reject "*". Name the origins that need it:
#   cors_allowed_origins = ["https://app.example.com"]
cors_allowed_origins = []

# Authentication. Off by default; every route except /_cluster/health requires
# `Authorization: Bearer <key>` once enabled. Required by the "external" profile.
#
#   1. Mint a key and write its digest where the container can read it:
#        cameodb keygen --role admin --label ops \
#          --hash-out ./docker/config/keys/ops --key-out ~/.cameodb/ops.key
#   2. Mount the directory read-only (see docker-compose.yml) and uncomment below.
#   3. Use it:  cameodb client --api-key-file ~/.cameodb/ops.key list indexes
#
[security]
enabled = false

# This node is reachable off-box — profile = "internal" with a non-loopback bind — so with
# authentication off every route, including /_admin/*, is open to anyone who can reach the
# port. The node starts and warns; `cameodb check-config` exits non-zero, so a deploy step
# gates on it. To close it, mint a key:
#   cameodb keygen --role admin --label ops \
#     --hash-out /etc/cameodb/keys/ops --key-out ~/.cameodb/ops.key
# then set enabled = true above and add the matching [[security.api_keys]] entry.

# [security]
# enabled = true
#
# [[security.api_keys]]
# key_hash_file = "/etc/cameodb/keys/ops"
# role = "admin"                         # admin | writer | reader
# label = "ops"
# # allowed_indexes = ["docs"]           # optional: restrict this key to named indexes
#
# # Audit trail. Point `file` at a mounted volume — a container's own filesystem is exactly
# # as durable as the container, and the trail is worth keeping past it.
# [security.audit]
# enabled = true
# file = "/data/audit/audit.jsonl"

# How large a thing may get on this node, as opposed to what one caller may ask for — that is
# [security.limits] below. max_record_size_mb is the source of truth: the HTTP body ceiling, the
# inter-node message size, the request timeout and the largest MCP response all derive from it,
# so raising it for large documents moves them together. `cameodb check-config` prints what each
# one resolved to.
[limits]
max_record_size_mb = 64
# 0 derives it from max_record_size_mb (+64 MB for framing). Set it to pin the body ceiling on
# its own; max_concurrent_requests multiplied by it has to fit inside total_memory_limit_mb,
# because in-flight bodies are held in memory.
max_body_size_mb = 0
# The node's memory budget: the indexer pool is sized from it and startup weighs the body
# ceiling against it.
total_memory_limit_mb = 4096
# Largest MCP search response in bytes. Unset it follows the body ceiling; set it below that
# where the callers are agents whose context is smaller than what the node can send.
# max_response_bytes = 16777216

[network.cluster]
enabled = false
bind_address = "0.0.0.0"
cluster_port = 9580
cluster_name = "cameodb-cluster"
seed_nodes = []

# Optional: Expected cluster nodes for validation
# cluster_nodes = []

[storage]
data_paths = ["/data/cameodb"]
disk_usage_threshold_percent = 90
wal_sync = true
wal_segment_size_mb = 64
default_batch_size = 5000
num_shards_init = 4
max_shards_per_node = 8

# CPU affinity. Writer pinning is neutral and on; the other two measured as regressions
# and are off — see docs/CONFIGURATION.md before changing them. All three are no-ops
# unless the container can actually see the cores it is pinning to, so check
# `GET /_admin/workers` rather than assuming: it reports the outcome, not the request.
writer_core_affinity = true
shard_affine_dispatch = false
worker_core_affinity = false

[search]
indexer_memory_min_mb = 32
indexer_memory_max_mb = 512
memory_pressure_threshold_percent = 80
# Concurrent searches allowed on the read pool. Keep this at or below the core count the
# container is actually given: reads share cores with the pinned shard writers, and letting
# more searches run than there are cores costs the write path far more than it gains the
# read path. This file shipped 16 against a typical 4-8 core container; measured on an
# 8-core node under mixed read/write load, 16 was worse than 8 on every axis — search p99
# 15.44ms vs 13.46ms, write throughput 1 776 vs 1 895 ok/s, and run-to-run spread several
# times wider. See docs/CONFIGURATION.md.
search_threads = 8
enable_streaming_search = true
max_concurrent_shard_searches = 32
max_concurrent_remote_searches = 8
# Accepted and inert. It gated one `break` in the streaming merge that could only fire when no
# work remained to skip, and that discarded a source's results after they had already arrived —
# so any search whose limit was below the match count lost a whole node from both its count and
# its merge. Setting it either way changes nothing now.
enable_early_termination = true
supervisor_timeout_secs = 5
default_search_limit = 10