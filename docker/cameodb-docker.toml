[server.http]
port = 9480
host = "0.0.0.0"
request_timeout_secs = 30
max_body_size_mb = 200
cors_enabled = true

[server.node]
max_shards = 8
init_shards = 4
writer_memory_default_mb = 32

[storage]
data_paths = ["/data/cameodb"]
disk_usage_threshold = 0.9
wal_sync = true
wal_segment_size_mb = 64

[search]
writer_memory_min_mb = 16
writer_memory_max_mb = 256
default_batch_size = 1000
total_memory_limit_mb = 2048
memory_pressure_threshold = 0.8
search_threads = 8
index_refresh_interval_secs = 5

[cluster]
# Enable distributed actor system
distributed_actors = true
# Cluster communication port (libp2p) - aligned with gRPC best practices
cluster_port = 9580
# Bootstrap nodes for cluster discovery (comma-separated)
bootstrap_nodes = []
# Peer discovery via Kademlia DHT for enterprise environments
# Cluster name for isolation
cluster_name = "cameodb-cluster"

