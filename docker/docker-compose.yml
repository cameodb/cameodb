services:
  cameodb:
    container_name: cameodb
    
    # BUILD CONFIGURATION
    build:
      context: ..
      dockerfile: Dockerfile
      # This injects the secret into the build stage only
      secrets:
        - zscaler
    
    ports:
      - "9480:9480"
      - "9580:9580"
    
    # Permissions: Distroless nonroot user
    user: "65532:65532"

    # RUNTIME VOLUMES
    # Note: No certificates here. Only Config and Data.
    volumes:
      # 1. Config: Project Root -> Container (Read Only)
      - ../docker/cameodb-docker.toml:/etc/cameodb/cameodb.toml:ro

      # 2. Data: Project Root/data/cameodb -> Container
      - ../data/cameodb:/data/cameodb

    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "/usr/local/bin/cameodb", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

# SECRET DEFINITION
# This points to the file on your HOST machine.
secrets:
  zscaler:
    file: /usr/local/share/ca-certificates/Zscaler.crt