[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.102"
arc-swap = "1"
axum = "0.8.9"
axum-extra = "0.10.3"
bincode-next = { version = "3", features = ["serde"] }
futures = "0.3.32"
kameo = { version = "0.21", features = ["remote", "macros"] }
libp2p = { version = "0.56.0", features = ["tcp", "dns", "quic", "noise", "yamux", "macros", "kad", "tokio", "serde", "request-response"] }
num_cpus = "1.17"
redb = "4.1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde-saphyr = "0.0.28"
tantivy = { version = "0.26.1", features = ["stemmer"] }
tokio = { version = "1.52.1", features = ["full"] }
toml = "1.1"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "cors", "limit", "compression-br", "decompression-br"] }
thiserror = "2.0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["v4", "v5", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bytes = "1.11.1"
http-body-util = "0.1.3"
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["codec", "io"] }
rustyline = "18"
rayon = "1.12"
sysinfo = "0.39.3"
yamux = "0.13"

[profile.release]
opt-level = 3           # Maximum optimization
lto = true              # Full Link Time Optimization for smallest binary
codegen-units = 1       # Single codegen unit for best optimization
strip = true            # Strip all symbols for smallest binary
debug = false           # No debug info
panic = "abort"         # Smaller panic handling

# Docker-friendly profile: thin LTO avoids OOM in memory-constrained builders
[profile.release-docker]
inherits = "release"
lto = "thin"
codegen-units = 4
