[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
bincode = "1.3"
futures = "0.3.30"
kameo = { version = "0.19", features = ["remote", "macros"] }
libp2p = { version = "0.56", features = ["tcp", "dns", "quic", "noise", "yamux", "macros", "kad", "tokio", "serde", "request-response"] }
num_cpus = "1.16"
redb = "3.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yml = "0.0.12"
tantivy = "0.25"
tokio = { version = "1.48", features = ["full"] }
toml = "0.8"
tower = "0.4"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "compression-br", "decompression-br"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bytes = "1.6"
http-body-util = "0.1"
