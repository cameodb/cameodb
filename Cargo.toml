[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.102"
arc-swap = "1"
axum = "0.8.8"
axum-extra = "0.10.3"
bincode = "1.3"
futures = "0.3.32"
kameo = { version = "0.19", features = ["remote", "macros"] }
libp2p = { version = "0.56.0", features = ["tcp", "dns", "quic", "noise", "yamux", "macros", "kad", "tokio", "serde", "request-response"] }
num_cpus = "1.17"
redb = "3.1.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_yml = "0.0.12"
tantivy = "0.25"
tokio = { version = "1.51.0", features = ["full"] }
toml = "0.8"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "cors", "limit", "compression-br", "decompression-br"] }
thiserror = "2.0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.23.0", features = ["v4", "v5", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bytes = "1.11.1"
http-body-util = "0.1.3"
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["codec", "io"] }

[profile.release]
opt-level = 3           # Maximum optimization
lto = true              # Full Link Time Optimization for smallest binary
codegen-units = 1       # Single codegen unit for best optimization
strip = true            # Strip all symbols for smallest binary
debug = false           # No debug info
panic = "abort"         # Smaller panic handling

# Docker-friendly profile: thin LTO avoids OOM in memory-constrained builders
[profile.release-docker]
inherits = "release"
lto = "thin"
codegen-units = 4
