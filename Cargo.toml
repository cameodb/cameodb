[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.102"
arc-swap = "1"
axum = "0.8.8"
axum-extra = "0.10.3"
bincode = "1.3"
futures = "0.3.30"
kameo = { version = "0.19", features = ["remote", "macros"] }
libp2p = { version = "0.56.0", features = ["tcp", "dns", "quic", "noise", "yamux", "macros", "kad", "tokio", "serde", "request-response"] }
num_cpus = "1.16"
redb = "3.1.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_yml = "0.0.12"
tantivy = "0.25"
tokio = { version = "1.50.0", features = ["full"] }
toml = "0.8"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "cors", "limit", "compression-br", "decompression-br"] }
thiserror = "2.0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["v4", "v5", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bytes = "1.11.1"
http-body-util = "0.1.2"
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.17", features = ["codec", "io"] }

[profile.release]
opt-level = 3       # Required for _FORTIFY_SOURCE=2 to work properly
lto = true          # Link Time Optimization for smaller/faster binaries
codegen-units = 1   # Better optimization, slightly slower build
strip = "symbols"   # Automatically strips debug symbols
panic = "abort"     # Reduces binary size

# Optimized profile for package builds (RPM/DEB)
[profile.release-lto]
inherits = "release"
opt-level = 3
debug = false
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
